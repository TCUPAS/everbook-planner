<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everbook Modular Planner Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @page {
    size: letter landscape;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #e5e7eb;
    font-family: 'Inter', sans-serif;
    color: #1f2937;
  }

  /* Control Panel */
  #control-panel {
    background: #111827;
    color: #f9fafb;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .controls-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9ca3af;
  }
  input[type="date"], select {
    background: #1f2937;
    border: 1px solid #374151;
    color: #fff;
    padding: 6px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    border-radius: 4px;
  }
  .btn {
    background: #374151;
    color: #fff;
    border: 1px solid #4b5563;
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    letter-spacing: 0.08em;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .btn:hover { background: #4b5563; }
  .btn-primary { background: #059669; border-color: #10b981; }
  .btn-primary:hover { background: #10b981; }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #e5e7eb;
    cursor: pointer;
  }

  /* Sheet Architecture: Standard US Letter Landscape (11in x 8.5in) */
  .folio-sheet {
    width: 11in;
    height: 8.5in;
    margin: 20px auto;
    background: #fff;
    display: flex;
    page-break-after: always;
    position: relative;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  @media print {
    body { background: #fff; }
    #control-panel { display: none !important; }
    .folio-sheet {
      margin: 0;
      box-shadow: none;
      width: 11in;
      height: 8.5in;
    }
  }

  .fold-line {
    position: absolute;
    left: 5.5in;
    top: 0;
    bottom: 0;
    width: 1px;
    border-left: 1px dashed #d1d5db;
    z-index: 10;
  }

  /* Half-Letter Page: 5.5in x 8.5in */
  .page {
    width: 5.5in;
    height: 8.5in;
    padding: 0.45in 0.4in 0.4in 0.4in;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 3.7mm Sterling Ink Grid */
  .grid-bg {
    background-image: 
      linear-gradient(to right, #e7e9ec 1px, transparent 1px),
      linear-gradient(to bottom, #e7e9ec 1px, transparent 1px);
    background-size: 3.7mm 3.7mm;
  }

  /* Typography */
  .serif-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20pt;
    font-weight: 500;
    color: #111827;
    line-height: 1;
    margin: 0;
  }
  .sub-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .tag-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6.5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #374151;
  }
  .border-box {
    border: 0.5pt solid #4b5563;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 0.5pt solid #4b5563;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }

  /* Time Ladder Layouts */
  .weekly-columns {
    display: grid;
    grid-template-columns: repeat(5, 1fr) 0.9fr;
    height: 100%;
    border: 0.5pt solid #4b5563;
    background-color: #fff;
  }
  .day-col {
    border-right: 0.5pt solid #e5e7eb;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .day-col:last-child { border-right: none; }
  .day-head {
    text-align: center;
    padding: 3px 0;
    border-bottom: 0.5pt solid #4b5563;
    background: #fff;
  }
  .day-head .d-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11pt;
    font-weight: 600;
  }
  .day-head .d-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
    letter-spacing: 0.1em;
  }
  .time-ladder {
    flex-grow: 1;
    position: relative;
  }
  .hour-mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #9ca3af;
    position: absolute;
    left: 2px;
    line-height: 1;
  }

  /* Repeatables Floor */
  .repeatables-floor {
    border: 0.5pt solid #4b5563;
    border-top: none;
    background: #fff;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .repeatables-header {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #4b5563;
    border-bottom: 0.5pt solid #e5e7eb;
    padding-bottom: 2px;
  }
  .repeatables-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5pt dashed #e5e7eb;
    padding: 2px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
  }
  .repeatables-row:last-child { border-bottom: none; }

  /* Monthly Calendar Grids */
  .cal-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    height: 100%;
  }
  .cal-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6pt;
    font-weight: 500;
    border: 0.5pt solid #4b5563;
    background: #fff;
    padding: 2px;
    text-align: center;
  }
  .cal-table td {
    border: 0.5pt solid #4b5563;
    vertical-align: top;
    padding: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 9pt;
  }
  .cal-table td.dim { color: #d1d5db; }
</style>
</head>
<body>

<div id="control-panel">
  <div class="controls-group">
    <label>Start: <input type="date" id="start-date" value="2026-10-19"></label>
    <label>End: <input type="date" id="end-date" value="2026-11-01"></label>
  </div>
  <div class="controls-group">
    <label class="checkbox-label"><input type="checkbox" id="gen-quintiles" checked> Quintiles</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-monthly" checked> Monthly</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-weekly" checked> Weekly</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-daily" checked> Daily</label>
  </div>
  <div class="controls-group">
    <button class="btn" onclick="buildPlanner()">Generate Pages</button>
    <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
  </div>
</div>

<div id="planner-mount"></div>

<script>
const MONTH_NAMES = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const DAY_CODES = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

function formatDateISO(d) {
  return d.toISOString().split('T')[0];
}

function getWeekNumber(d) {
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) {
    target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  }
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}

function renderQuintiles(targetYear) {
  return `
  <!-- QUINTILE 1: WINTER -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">winter.</h1><div class="sub-code">quintile i &bull; jan / feb / mar ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">winter.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JANUARY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">FEBRUARY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">MARCH</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 2: SPRING -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">spring.</h1><div class="sub-code">quintile ii &bull; apr / may ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">spring.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">APRIL</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">MAY</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 3: SUMMER -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">summer.</h1><div class="sub-code">quintile iii &bull; jun / jul / aug ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">summer.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JUNE</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JULY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">AUGUST</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 4: FALL -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">fall.</h1><div class="sub-code">quintile iv &bull; sep / oct ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">fall.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">SEPTEMBER</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">OCTOBER</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 5: HOLIDAY SEASON -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">holiday season.</h1><div class="sub-code">quintile v &bull; nov / dec ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">holiday season.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">NOVEMBER</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">DECEMBER</span></div>
      </div>
    </div>
  </div>
  <!-- 2028+ HORIZON -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">${targetYear + 1}+.</h1><div class="sub-code">long-range horizon</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">${targetYear + 1}+.</h1><div class="sub-code">forward park</div></div><span class="tag-label">${targetYear + 1}</span></div>
      <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:6px;">
        <div class="border-box grid-bg" style="padding:4px;"><span class="sub-code">Q1</span></div>
        <div class="border-box grid-bg" style="padding:4px;"><span class="sub-code">Q2</span></div>
        <div class="border-box grid-bg" style="padding:4px;"><span class="sub-code">Q3</span></div>
        <div class="border-box grid-bg" style="padding:4px;"><span class="sub-code">Q4</span></div>
      </div>
    </div>
  </div>`;
}

function renderMonthlyCal(year, monthIndex) {
  const firstDay = new Date(year, monthIndex, 1);
  const lastDay = new Date(year, monthIndex + 1, 0);
  const monthName = MONTH_NAMES[monthIndex];

  let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Mon-start
  let totalDays = lastDay.getDate();

  let cells = [];
  for (let i = 0; i < startOffset; i++) cells.push('<td class="dim"></td>');
  for (let d = 1; d <= totalDays; d++) cells.push(`<td><b>${d}</b></td>`);
  while (cells.length % 7 !== 0) cells.push('<td class="dim"></td>');

  let rows = [];
  for (let i = 0; i < cells.length; i += 7) {
    rows.push(`<tr>${cells.slice(i, i + 7).join('')}</tr>`);
  }

  const tableHTML = `
    <table class="cal-table grid-bg">
      <thead>
        <tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th></tr>
      </thead>
      <tbody>${rows.join('')}</tbody>
    </table>
  `;

  // Standard Monthly Spread: Work Left, Personal Right
  return `
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; work monthly</div></div><span class="tag-label">calendar</span></div>
      <div style="flex:1;">${tableHTML}</div>
    </div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; personal monthly</div></div><span class="tag-label">calendar</span></div>
      <div style="flex:1;">${tableHTML}</div>
    </div>
  </div>
  <!-- Vertical Log 1-31 Spread -->
  <div class="folio-sheet"><div class="fold-line"></div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; monthly log</div></div><span class="tag-label">dated log</span></div>
      <div class="border-box grid-bg" style="flex:1; display:flex; flex-direction:column; padding:2px;">
        ${Array.from({length: totalDays}, (_, idx) => {
          const dayD = new Date(year, monthIndex, idx + 1);
          const isWeekend = dayD.getDay() === 0 || dayD.getDay() === 6;
          return `<div style="display:flex; border-bottom:0.5pt solid #e5e7eb; font-family:'IBM Plex Mono'; font-size:5.5pt; height: calc(100% / ${totalDays}); align-items:center; ${isWeekend ? 'background:rgba(0,0,0,0.03); font-weight:600;' : ''}">
            <span style="width:18px; text-align:right; margin-right:4px;">\${idx + 1}</span>
            <span style="width:16px; color:#6b7280;">\${DAY_CODES[dayD.getDay()]}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">notes.</h1><div class="sub-code">${monthName} ${year}</div></div><span class="tag-label">parking log</span></div>
      <div class="border-box grid-bg" style="flex:1;"></div>
    </div>
  </div>`;
}

function renderWeeklySpread(monDate) {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const cur = new Date(monDate);
    cur.setDate(monDate.getDate() + i);
    days.push(cur);
  }
  const weekNum = getWeekNumber(monDate);
  const monthName = MONTH_NAMES[monDate.getMonth()];
  const year = monDate.getFullYear();

  return `
  <div class="folio-sheet"><div class="fold-line"></div>
    <!-- WORK WEEK -->
    <div class="page">
      <div class="header-row">
        <div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">wk ${weekNum} &bull; work</div></div>
        <span class="tag-label">schedule</span>
      </div>
      <div class="weekly-columns grid-bg" style="flex:1;">
        ${days.slice(0, 5).map(d => `
          <div class="day-col">
            <div class="day-head"><span class="d-num">\${d.getDate()}</span> <span class="d-name">\${DAY_CODES[d.getDay()]}</span></div>
            <div class="time-ladder">
              <span class="hour-mark" style="top: 8%;">7a</span>
              <span class="hour-mark" style="top: 30%;">10a</span>
              <span class="hour-mark" style="top: 52%;">1p</span>
              <span class="hour-mark" style="top: 74%;">4p</span>
              <span class="hour-mark" style="top: 92%;">7p</span>
            </div>
          </div>
        `).join('')}
        <div class="day-col">
          <div class="day-head"><span class="d-num">${days[5].getDate()}&ndash;${days[6].getDate()}</span> <span class="d-name">SS</span></div>
          <div style="flex:1;"></div>
        </div>
      </div>
      <div class="repeatables-floor grid-bg">
        <div class="repeatables-header"><span>WEEKLY REPEATABLES</span><span>M T W T F S S</span></div>
        <div class="repeatables-row"><span>&square;</span><span>&cir; &cir; &cir; &cir; &cir; &cir; &cir;</span></div>
        <div class="repeatables-row"><span>&square;</span><span>&cir; &cir; &cir; &cir; &cir; &cir; &cir;</span></div>
      </div>
    </div>
    <!-- PERSONAL WEEK -->
    <div class="page">
      <div class="header-row">
        <div><h1 class="serif-header">living.</h1><div class="sub-code">wk ${weekNum} &bull; personal</div></div>
        <span class="tag-label">dashboard</span>
      </div>
      <div class="border-box grid-bg" style="flex:1;"></div>
      <div class="repeatables-floor grid-bg">
        <div class="repeatables-header"><span>HABITS & ROUTINES</span><span>M T W T F S S</span></div>
        <div class="repeatables-row"><span>&square;</span><span>&cir; &cir; &cir; &cir; &cir; &cir; &cir;</span></div>
        <div class="repeatables-row"><span>&square;</span><span>&cir; &cir; &cir; &cir; &cir; &cir; &cir;</span></div>
      </div>
    </div>
  </div>`;
}

function renderDailySpread(dateObj) {
  const dayNum = dateObj.getDate();
  const dayName = DAY_CODES[dateObj.getDay()];
  const monthName = MONTH_NAMES[dateObj.getMonth()];
  const year = dateObj.getFullYear();

  const hoursLadder = ["6a","7a","8a","9a","10a","11a","12p","1p","2p","3p","4p","5p","6p","7p","8p","9p","10p","11p"];

  return `
  <div class="folio-sheet"><div class="fold-line"></div>
    <!-- DAILY WORK -->
    <div class="page">
      <div class="header-row">
        <div><h1 class="serif-header">${dayName} ${dayNum}</h1><div class="sub-code">${monthName} ${year} &bull; work daily</div></div>
        <div class="sub-code" style="letter-spacing:0.25em;">M T W T F S S</div>
      </div>
      <div class="border-box grid-bg" style="flex:1; display:flex;">
        <div style="width:0.35in; border-right:0.5pt solid #4b5563; background:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:4px 0; text-align:center; font-family:'IBM Plex Mono'; font-size:5pt; color:#4b5563;">
          ${hoursLadder.map(h => `<div>\${h}</div>`).join('')}
        </div>
        <div style="flex:1;"></div>
      </div>
    </div>
    <!-- DAILY PERSONAL -->
    <div class="page">
      <div class="header-row">
        <div><h1 class="serif-header">${dayName} ${dayNum}</h1><div class="sub-code">${monthName} ${year} &bull; personal daily</div></div>
        <div class="sub-code" style="letter-spacing:0.25em;">M T W T F S S</div>
      </div>
      <div class="border-box grid-bg" style="flex:1; display:flex;">
        <div style="width:0.35in; border-right:0.5pt solid #4b5563; background:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:4px 0; text-align:center; font-family:'IBM Plex Mono'; font-size:5pt; color:#4b5563;">
          ${hoursLadder.map(h => `<div>\${h}</div>`).join('')}
        </div>
        <div style="flex:1;"></div>
      </div>
    </div>
  </div>`;
}

function buildPlanner() {
  const startVal = document.getElementById('start-date').value;
  const endVal = document.getElementById('end-date').value;
  if (!startVal || !endVal) return;

  const startDate = new Date(startVal + 'T00:00:00');
  const endDate = new Date(endVal + 'T00:00:00');
  const mount = document.getElementById('planner-mount');
  mount.innerHTML = '';

  let htmlBuffer = '';

  // 1. Quintiles
  if (document.getElementById('gen-quintiles').checked) {
    htmlBuffer += renderQuintiles(startDate.getFullYear());
  }

  // 2. Months
  if (document.getElementById('gen-monthly').checked) {
    let curMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
    const endMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
    while (curMonth <= endMonth) {
      htmlBuffer += renderMonthlyCal(curMonth.getFullYear(), curMonth.getMonth());
      curMonth.setMonth(curMonth.getMonth() + 1);
    }
  }

  // 3. Weeks
  if (document.getElementById('gen-weekly').checked) {
    let curMon = new Date(startDate);
    const day = curMon.getDay();
    const diff = curMon.getDate() - day + (day === 0 ? -6 : 1);
    curMon.setDate(diff);

    while (curMon <= endDate) {
      htmlBuffer += renderWeeklySpread(curMon);
      curMon.setDate(curMon.getDate() + 7);
    }
  }

  // 4. Dailies
  if (document.getElementById('gen-daily').checked) {
    let curDay = new Date(startDate);
    while (curDay <= endDate) {
      htmlBuffer += renderDailySpread(curDay);
      curDay.setDate(curDay.getDate() + 1);
    }
  }

  mount.innerHTML = htmlBuffer;
}

window.onload = buildPlanner;
</script>
</body>
</html>
