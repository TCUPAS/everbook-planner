<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everbook Modular Planner Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @page {
    size: letter landscape;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #e5e7eb;
    font-family: 'Inter', sans-serif;
    color: #1f2937;
  }

  /* Control Panel */
  #control-panel {
    background: #111827;
    color: #f9fafb;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .controls-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9ca3af;
  }
  input[type="date"], select {
    background: #1f2937;
    border: 1px solid #374151;
    color: #fff;
    padding: 6px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    border-radius: 4px;
  }
  .btn {
    background: #374151;
    color: #fff;
    border: 1px solid #4b5563;
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    letter-spacing: 0.08em;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .btn:hover { background: #4b5563; }
  .btn-primary { background: #059669; border-color: #10b981; }
  .btn-primary:hover { background: #10b981; }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #e5e7eb;
    cursor: pointer;
  }

  /* Sheet Architecture: Standard US Letter Landscape (11in x 8.5in) */
  .folio-sheet {
    width: 11in;
    height: 8.5in;
    margin: 20px auto;
    background: #fff;
    display: flex;
    page-break-after: always;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .folio-sheet:last-child { page-break-after: auto; }
  @media print {
    body { background: #fff; }
    #control-panel { display: none !important; }
    .folio-sheet {
      margin: 0;
      box-shadow: none;
      width: 11in;
      height: 8.5in;
    }
  }

  .fold-line {
    position: absolute;
    left: 5.5in;
    top: 0;
    bottom: 0;
    width: 1px;
    border-left: 1px dashed #d1d5db;
    z-index: 10;
  }

  /* Half-Letter Page: 5.5in x 8.5in */
  .page {
    width: 5.5in;
    height: 8.5in;
    padding: 0.45in 0.4in 0.4in 0.4in;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 3.7mm Sterling Ink Grid */
  .grid-bg {
    background-image: 
      linear-gradient(to right, #e7e9ec 1px, transparent 1px),
      linear-gradient(to bottom, #e7e9ec 1px, transparent 1px);
    background-size: 3.7mm 3.7mm;
  }

  /* Typography */
  .serif-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20pt;
    font-weight: 500;
    color: #111827;
    line-height: 1;
    margin: 0;
  }
  .sub-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .tag-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6.5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #374151;
  }
  .border-box {
    border: 0.5pt solid #4b5563;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 0.5pt solid #4b5563;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }

  /* Time Ladder Layouts */
  .weekly-columns {
    display: grid;
    grid-template-columns: repeat(5, 1fr) 0.9fr;
    height: 100%;
    border: 0.5pt solid #4b5563;
    background-color: #fff;
  }
  .day-col {
    border-right: 0.5pt solid #e5e7eb;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .day-col:last-child { border-right: none; }
  .day-head {
    text-align: center;
    padding: 3px 0;
    border-bottom: 0.5pt solid #4b5563;
    background: #fff;
  }
  .day-head .d-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11pt;
    font-weight: 600;
  }
  .day-head .d-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
    letter-spacing: 0.1em;
  }
  .time-ladder {
    flex-grow: 1;
    position: relative;
  }
  .hour-mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #9ca3af;
    position: absolute;
    left: 2px;
    line-height: 1;
  }

  /* Repeatables Floor */
  .repeatables-floor {
    border: 0.5pt solid #4b5563;
    border-top: none;
    background: #fff;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .repeatables-header {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #4b5563;
    border-bottom: 0.5pt solid #e5e7eb;
    padding-bottom: 2px;
  }
  .repeatables-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5pt dashed #e5e7eb;
    padding: 2px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
  }
  .repeatables-row:last-child { border-bottom: none; }

  /* Monthly Calendar Grids */
  .cal-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    height: 100%;
  }
  .cal-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6pt;
    font-weight: 500;
    border: 0.5pt solid #4b5563;
    background: #fff;
    padding: 2px;
    text-align: center;
  }
  .cal-table td {
    border: 0.5pt solid #4b5563;
    vertical-align: top;
    padding: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 9pt;
  }
  .cal-table td.dim { color: #d1d5db; }

  /* Daily time ladder: each hour = 2 grid squares (7.4mm), half-hour grid line between */
  .ladder {
    position: relative;
    flex: none;
  }
  .ladder-gutter {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0.35in;
    background: #fff;
    border-right: 0.5pt solid #4b5563;
  }
  .ladder-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 0.75pt solid #6b7280;
  }
  .ladder-line.half {
    left: 0.35in;
    border-top: 0.5pt solid #9ca3af;
  }
  .ladder-label {
    position: absolute;
    left: 0.175in;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 0 2px;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #4b5563;
    line-height: 1;
  }
  .time-ladder .ladder-line.half { left: 0; }
  .wk-label {
    position: absolute;
    left: 2px;
    transform: translateY(-50%);
    background: #fff;
    padding: 0 1px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 4.5pt;
    color: #4b5563;
    line-height: 1;
  }
  .shutdown-row {
    display: flex;
    justify-content: flex-end;
    padding-top: 4px;
  }

  /* Shared ruled boxes */
  .plan-box {
    border: 0.5pt solid #4b5563;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rule-row {
    flex: 1;
    min-height: 5mm;
    border-bottom: 0.5pt dashed #d1d5db;
    display: flex;
    align-items: flex-end;
  }
  .rule-row:last-child { border-bottom: none; }
  .id-slot {
    align-self: stretch;
    width: 0.32in;
    margin-right: 6px;
    border-right: 0.5pt solid #e5e7eb;
    display: flex;
    align-items: flex-end;
    padding-bottom: 1px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #9ca3af;
  }
  .mini {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 4.5pt;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9ca3af;
    padding-bottom: 1px;
  }
  .check-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding-top: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 6pt;
    color: #374151;
  }

  /* Weekly plan: day-by-day */
  .plan-day {
    flex: 1;
    display: flex;
    border-bottom: 0.5pt solid #e5e7eb;
  }
  .plan-day:last-child { border-bottom: none; }
  .plan-day.weekend { flex: 0.7; }
  .plan-day-label {
    width: 0.4in;
    border-right: 0.5pt solid #4b5563;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .plan-day-label .d-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11pt;
    font-weight: 600;
    line-height: 1;
  }
  .plan-day-label .d-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5.5pt;
    letter-spacing: 0.1em;
  }

  /* Season projects: active slots */
  .proj-slot {
    flex: 1;
    display: flex;
    border: 0.5pt solid #4b5563;
  }
  .proj-id {
    width: 0.4in;
    border-right: 0.5pt solid #4b5563;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13pt;
    font-weight: 600;
  }
  .proj-done {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7pt;
    font-weight: 400;
    color: #6b7280;
  }
  .proj-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 6px;
  }
  .proj-lines .rule-row { align-items: flex-start; padding-top: 2px; }
  .course-status {
    width: 0.45in;
    border-left: 0.5pt solid #e5e7eb;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding-left: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #6b7280;
  }

  /* Season projects: holding tank */
  .tank-head, .tank-row {
    display: grid;
    grid-template-columns: 1fr 0.45in 0.6in;
  }
  .tank-head {
    border-bottom: 0.5pt solid #4b5563;
    padding: 3px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #4b5563;
  }
  .tank-head span { padding-left: 4px; }
  .tank-row {
    flex: 1;
    border-bottom: 0.5pt dashed #d1d5db;
  }
  .tank-row span + span, .tank-head span + span { border-left: 0.5pt solid #e5e7eb; }
  .tank-wl {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 5pt;
    color: #9ca3af;
  }

  /* Booklet covers (printed on the back of each sheet) */
  .cover-panel {
    justify-content: flex-start;
    padding: 1.6in 0.6in 0.6in 0.6in;
  }
  .cover-kicker { letter-spacing: 0.22em; }
  .cover-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34pt;
    font-weight: 500;
    line-height: 1.05;
    color: #111827;
    margin: 10px 0 14px 0;
  }
  .cover-rule {
    width: 1.2in;
    border-top: 0.75pt solid #4b5563;
    margin-bottom: 10px;
  }
  .cover-sub { font-size: 7pt; }
</style>
</head>
<body>

<div id="control-panel">
  <div class="controls-group">
    <label>Start: <input type="date" id="start-date" value="2026-10-19"></label>
    <label>End: <input type="date" id="end-date" value="2026-11-01"></label>
  </div>
  <div class="controls-group">
    <label>Work day: <select id="work-start"><option value="5">5a</option><option value="6">6a</option><option value="7" selected>7a</option><option value="8">8a</option><option value="9">9a</option><option value="10">10a</option><option value="11">11a</option><option value="12">12p</option><option value="13">1p</option></select></label>
    <label>Personal day: <select id="personal-start"><option value="5">5a</option><option value="6">6a</option><option value="7" selected>7a</option><option value="8">8a</option><option value="9">9a</option><option value="10">10a</option><option value="11">11a</option><option value="12">12p</option><option value="13">1p</option></select></label>
  </div>
  <div class="controls-group">
    <label class="checkbox-label"><input type="checkbox" id="gen-covers" checked> Covers</label>
    <label>Cover side: <select id="cover-side"><option value="right" selected>right</option><option value="left">left</option></select></label>
  </div>
  <div class="controls-group">
    <label class="checkbox-label"><input type="checkbox" id="gen-courses" checked> Courses</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-someday" checked> Someday</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-tasks" checked> Tasks</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-books" checked> Books</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-workouts" checked> Workouts</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-quintiles" checked> Quintiles</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-monthly" checked> Monthly</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-weekly" checked> Weekly</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-plan" checked> Week Plan</label>
    <label class="checkbox-label"><input type="checkbox" id="gen-daily" checked> Daily</label>
  </div>
  <div class="controls-group">
    <button class="btn" onclick="buildPlanner()">Generate Pages</button>
    <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
  </div>
</div>

<div id="planner-mount"></div>

<script>
const MONTH_NAMES = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const DAY_CODES = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

const DAY_FULL = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

// Each sheet carries its cover text; covers are added after generation when "Covers" is on.
function sheetOpen(kicker, title, sub) {
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  return `<div class="folio-sheet" data-kicker="${esc(kicker)}" data-title="${esc(title)}" data-sub="${esc(sub)}"><div class="fold-line"></div>`;
}

function weekRange(monDate) {
  const end = new Date(monDate);
  end.setDate(monDate.getDate() + 6);
  const a = `${MONTH_NAMES[monDate.getMonth()]} ${monDate.getDate()}`;
  const b = end.getMonth() === monDate.getMonth() ? `${end.getDate()}` : `${MONTH_NAMES[end.getMonth()]} ${end.getDate()}`;
  return `${a} \u2013 ${b}`;
}

function addCovers(mount, side) {
  [...mount.querySelectorAll('.folio-sheet[data-title]')].forEach(sheet => {
    const back = document.createElement('div');
    back.className = 'folio-sheet cover-sheet';
    const panel = (isCover) => {
      const pg = document.createElement('div');
      pg.className = 'page cover-panel';
      if (isCover) {
        pg.innerHTML = '<div class="sub-code cover-kicker"></div><h1 class="cover-title"></h1><div class="cover-rule"></div><div class="sub-code cover-sub"></div>';
        pg.querySelector('.cover-kicker').textContent = sheet.dataset.kicker;
        pg.querySelector('.cover-title').textContent = sheet.dataset.title;
        pg.querySelector('.cover-sub').textContent = sheet.dataset.sub;
      }
      return pg;
    };
    back.appendChild(panel(side === 'left'));
    back.appendChild(panel(side === 'right'));
    sheet.after(back);
  });
}

function formatDateISO(d) {
  return d.toISOString().split('T')[0];
}

function getWeekNumber(d) {
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) {
    target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  }
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}

function renderQuintiles(targetYear) {
  return `
  <!-- QUINTILE 1: WINTER -->
  ${sheetOpen('quintile i', 'winter.', `jan / feb / mar ${targetYear}`)}
    <div class="page"><div class="header-row"><div><h1 class="serif-header">winter.</h1><div class="sub-code">quintile i &bull; jan / feb / mar ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">winter.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JANUARY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">FEBRUARY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">MARCH</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 2: SPRING -->
  ${sheetOpen('quintile ii', 'spring.', `apr / may ${targetYear}`)}
    <div class="page"><div class="header-row"><div><h1 class="serif-header">spring.</h1><div class="sub-code">quintile ii &bull; apr / may ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">spring.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">APRIL</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">MAY</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 3: SUMMER -->
  ${sheetOpen('quintile iii', 'summer.', `jun / jul / aug ${targetYear}`)}
    <div class="page"><div class="header-row"><div><h1 class="serif-header">summer.</h1><div class="sub-code">quintile iii &bull; jun / jul / aug ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">summer.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JUNE</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">JULY</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">AUGUST</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 4: FALL -->
  ${sheetOpen('quintile iv', 'fall.', `sep / oct ${targetYear}`)}
    <div class="page"><div class="header-row"><div><h1 class="serif-header">fall.</h1><div class="sub-code">quintile iv &bull; sep / oct ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>
    <div class="page"><div class="header-row"><div><h1 class="serif-header">fall.</h1><div class="sub-code">monthly divisions</div></div><span class="tag-label">${targetYear}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">SEPTEMBER</span></div>
        <div class="border-box grid-bg" style="flex:1; padding:4px;"><span class="sub-code">OCTOBER</span></div>
      </div>
    </div>
  </div>
  <!-- QUINTILE 5: HOLIDAY SEASON -->
  ${sheetOpen('quintile v', 'holiday season.', `nov / dec ${targetYear}`)}
    <div class="page"><div class="header-row"><div><h1 class="serif-header">holiday season.</h1><div class="sub-code">quintile v &bull; nov / dec ${targetYear}</div></div><span class="tag-label">forward log</span></div><div class="border-box grid-bg" style="flex:1;"></div></div>

function renderMonthlyCal(year, monthIndex) {
  const firstDay = new Date(year, monthIndex, 1);
  const lastDay = new Date(year, monthIndex + 1, 0);
  const monthName = MONTH_NAMES[monthIndex];

  let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Mon-start
  let totalDays = lastDay.getDate();

  let cells = [];
  for (let i = 0; i < startOffset; i++) cells.push('<td class="dim"></td>');
  for (let d = 1; d <= totalDays; d++) cells.push(`<td><b>${d}</b></td>`);
  while (cells.length % 7 !== 0) cells.push('<td class="dim"></td>');

  let rows = [];
  for (let i = 0; i < cells.length; i += 7) {
    rows.push(`<tr>${cells.slice(i, i + 7).join('')}</tr>`);
  }

  const tableHTML = `
    <table class="cal-table grid-bg">
      <thead>
        <tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th></tr>
      </thead>
      <tbody>${rows.join('')}</tbody>
    </table>
  `;

  // Standard Monthly Spread: Work Left, Personal Right
  return `
  ${sheetOpen('monthly', `${monthName}.`, `${year}`)}
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; work monthly</div></div><span class="tag-label">calendar</span></div>
      <div style="flex:1;">${tableHTML}</div>
    </div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; personal monthly</div></div><span class="tag-label">calendar</span></div>
      <div style="flex:1;">${tableHTML}</div>
    </div>
  </div>
  <!-- Vertical Log 1-31 Spread -->
  ${sheetOpen('monthly log', `${monthName}.`, `${year} \u2022 dated log & notes`)}
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">${monthName}.</h1><div class="sub-code">${year} &bull; monthly log</div></div><span class="tag-label">dated log</span></div>
      <div class="border-box grid-bg" style="flex:1; display:flex; flex-direction:column; padding:2px;">
        ${Array.from({length: totalDays}, (_, idx) => {
          const dayD = new Date(year, monthIndex, idx + 1);
          const isWeekend = dayD.getDay() === 0 || dayD.getDay() === 6;
          return `<div style="display:flex; border-bottom:0.5pt solid #e5e7eb; font-family:'IBM Plex Mono', monospace; font-size:5.5pt; height: calc(100% / ${totalDays}); align-items:center; ${isWeekend ? 'background:rgba(0,0,0,0.03); font-weight:600;' : ''}">
            <span style="width:18px; text-align:right; margin-right:4px;">${idx + 1}</span>
            <span style="width:16px; color:#6b7280;">${DAY_CODES[dayD.getDay()]}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="page">
      <div class="header-row"><div><h1 class="serif-header">notes.</h1><div class="sub-code">${monthName} ${year}</div></div><span class="tag-label">parking log</span></div>
      <div class="border-box grid-bg" style="flex:1;"></div>
    </div>
  </div>`;
}

function renderWeekLadder(startHour) {
  const sq = 3.7;
  const step = sq * 2;  // weekly: 2 squares per hour (hour line + half-hour line)
  let marks = '';
  for (let i = 0; i <= LADDER_HOURS; i++) {
    const y = sq + i * step;
    marks += `<div class="ladder-line" style="top:${y.toFixed(1)}mm;"></div><span class="wk-label" style="top:${y.toFixed(1)}mm;">${hourLabel(startHour + i)}</span>`;
    if (i < LADDER_HOURS) marks += `<div class="ladder-line half" style="top:${(y + step / 2).toFixed(1)}mm;"></div>`;
  }
  const todoTop = (sq + LADDER_HOURS * step + sq).toFixed(1);
  marks += `<span class="mini" style="position:absolute; left:3px; top:${todoTop}mm;">to do</span>`;
  return `<div class="time-ladder grid-bg">${marks}</div>`;
}

const LADDER_HOURS = 11; // hours that fit on a half-letter page at 4 grid squares per hour

function hourLabel(h) {
  const hh = h % 24;
  if (hh === 0) return '12a';
  if (hh < 12) return `${hh}a`;
  if (hh === 12) return '12p';
  return `${hh - 12}p`;
}

function renderDayLadder(startHour) {
  const sq = 3.7;            // one grid square, mm
  const step = sq * 4;       // one hour = 4 squares; bold half-hour line at 2 squares
  const lead = sq;           // one square above the first hour so its label sits inside the box
  let marks = '';
  for (let i = 0; i <= LADDER_HOURS; i++) {
    const y = lead + i * step;
    marks += `<div class="ladder-line" style="top:${y.toFixed(1)}mm;"></div><div class="ladder-label" style="top:${y.toFixed(1)}mm;">${hourLabel(startHour + i)}</div>`;
    if (i < LADDER_HOURS) marks += `<div class="ladder-line half" style="top:${(y + step / 2).toFixed(1)}mm;"></div>`;
  }
  const height = (lead * 2 + LADDER_HOURS * step).toFixed(1);
  return `<div class="border-box grid-bg ladder" style="height:calc(${height}mm + 1pt);"><div class="ladder-gutter"></div>${marks}</div>`;
}

function buildPlanner() {
  const startVal = document.getElementById('start-date').value;
  const endVal = document.getElementById('end-date').value;
  if (!startVal || !endVal) return;

  const startDate = new Date(startVal + 'T00:00:00');
  const endDate = new Date(endVal + 'T00:00:00');
  const mount = document.getElementById('planner-mount');
  mount.innerHTML = '';

  const wantWeekly = document.getElementById('gen-weekly').checked;
  const wantPlan = document.getElementById('gen-plan').checked;
  const wantDaily = document.getElementById('gen-daily').checked;

  let htmlBuffer = '';

  // 0. Loose-leaf sheets: courses, someday / maybe, unscheduled
  if (document.getElementById('gen-courses').checked) {
    htmlBuffer += renderCourses();
  }
  if (document.getElementById('gen-someday').checked) {
    htmlBuffer += renderSomeday();
  }
  if (document.getElementById('gen-tasks').checked) {
    htmlBuffer += renderTasks();
  }
  if (document.getElementById('gen-books').checked) {
    htmlBuffer += renderBooks();
  }
  if (document.getElementById('gen-workouts').checked) {
    htmlBuffer += renderWorkouts();
  }

  // 1. Quintiles
  if (document.getElementById('gen-quintiles').checked) {
    htmlBuffer += renderQuintiles(startDate.getFullYear());
  }

  // 2. Months
  if (document.getElementById('gen-monthly').checked) {
    let curMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
    const endMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
    while (curMonth <= endMonth) {
      htmlBuffer += renderMonthlyCal(curMonth.getFullYear(), curMonth.getMonth());
      curMonth.setMonth(curMonth.getMonth() + 1);
    }
  }

  // 3. Week by week: weekly spread -> weekly plan -> that week's dailies
  if (wantWeekly || wantPlan || wantDaily) {
    let curMon = new Date(startDate);
    const day = curMon.getDay();
    curMon.setDate(curMon.getDate() - day + (day === 0 ? -6 : 1));

    while (curMon <= endDate) {
      if (wantWeekly) htmlBuffer += renderWeeklySpread(new Date(curMon));
      if (wantPlan) htmlBuffer += renderWeeklyPlan(new Date(curMon));
      if (wantDaily) {
        for (let i = 0; i < 7; i++) {
          const d = new Date(curMon);
          d.setDate(curMon.getDate() + i);
          if (d >= startDate && d <= endDate) htmlBuffer += renderDailySpread(d);
        }
      }
      curMon.setDate(curMon.getDate() + 7);
    }
  }

  mount.innerHTML = htmlBuffer;
  if (document.getElementById('gen-covers').checked) {
    addCovers(mount, document.getElementById('cover-side').value);
  }
}

window.onload = buildPlanner;
</script>
</body>
</html>
